# FISI-Lernkompass mit Docker
#   Starten:      docker compose up -d --build
#   Logs:         docker compose logs -f
#   Stoppen:      docker compose down
#   Sicherung:    docker compose exec app npm run backup
#   Inhalte prüfen: docker compose exec app npm run check-content

services:
  app:
    build:
      context: .
    image: fisi-lernkompass:latest
    container_name: fisi-lernkompass
    restart: unless-stopped
    ports:
      # Nur auf diesem Rechner erreichbar. Eigenen Port oder Freigabe im Netz nicht hier ändern,
      # sondern in docker-compose.override.yml (Vorlage: docker-compose.override.example.yml).
      # Die App hat kein Login, also nie ungeschützt ins Internet freigeben.
      - "127.0.0.1:3000:3000"
    environment:
      TZ: Europe/Berlin
      # Geänderte Inhalte ohne Neustart übernehmen; die Abfrage (POLL) ist unter Windows/macOS zuverlässiger
      CONTENT_WATCH: "true"
      CONTENT_WATCH_POLL: "true"
    volumes:
      # Lernstand und Sicherungen – bleiben bei Updates erhalten
      - ./data:/app/data
      # Inhalte nur lesend aus dem Projektordner, damit Änderungen sofort ankommen
      - ./content:/app/content:ro
