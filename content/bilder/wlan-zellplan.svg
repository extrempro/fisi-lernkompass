  <text class="sv-tb" x="470" y="60">Zellplanung im 2,4-GHz-Band</text>
  <text class="sv-tk" x="470" y="84">Nur die Kanäle 1, 6 und 11 überlappen</text>
  <text class="sv-tk" x="470" y="102">sich nicht. Benachbarte Zellen bekommen</text>
  <text class="sv-tk" x="470" y="120">unterschiedliche Kanäle – gleiche Kanäle</text>
  <text class="sv-tk" x="470" y="138">liegen möglichst weit auseinander.</text>
  <text class="sv-tk" x="470" y="156"></text>
  <text class="sv-tk" x="470" y="174">Zellen überlappen etwa 15–20 %,</text>
  <text class="sv-tk" x="470" y="192">damit Roaming ohne Abbruch klappt.</text>
  <text class="sv-tk" x="470" y="210"></text>
  <text class="sv-tk" x="470" y="228">Im 5-GHz-Band gibt es viel mehr</text>
  <text class="sv-tk" x="470" y="246">Kanäle – dort ist die Planung leichter.</text>
