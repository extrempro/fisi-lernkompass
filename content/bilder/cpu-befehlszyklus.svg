<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250">
  <defs><marker id="cpu-befehlszyklus-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-a" x="20" y="20" width="160" height="54" rx="6"/>
  <text class="sv-tb" x="100" y="45" text-anchor="middle">1. Holen (Fetch)</text>
