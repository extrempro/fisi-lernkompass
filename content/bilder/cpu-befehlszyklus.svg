  <line class="sv-ln" x1="182" y1="47" x2="256" y2="47" marker-end="url(#cpu-befehlszyklus-pf)"/>
  <line class="sv-ln" x1="340" y1="76" x2="340" y2="166" marker-end="url(#cpu-befehlszyklus-pf)"/>
  <line class="sv-ln" x1="258" y1="197" x2="184" y2="197" marker-end="url(#cpu-befehlszyklus-pf)"/>
  <line class="sv-ln" x1="100" y1="168" x2="100" y2="78" marker-end="url(#cpu-befehlszyklus-pf)"/>
