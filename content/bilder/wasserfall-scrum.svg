<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380">
  <defs><marker id="wasserfall-scrum-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
