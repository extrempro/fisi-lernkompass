  <line class="sv-ln" x1="480" y1="88" x2="480" y2="102" marker-end="url(#wasserfall-scrum-pf)"/>
  <circle class="sv-c" cx="630" cy="126" r="54"/>
  <text class="sv-tb" x="630" y="116" text-anchor="middle">Sprint</text>
  <text class="sv-tk" x="630" y="133" text-anchor="middle">1–4 Wochen</text>
