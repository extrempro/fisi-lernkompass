<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 322">
  <text class="sv-tb" x="64" y="18" text-anchor="start">IPv4-Header (mindestens 20 Byte)</text>
  <text class="sv-tk" x="72" y="40" text-anchor="middle">0</text>
  <text class="sv-tk" x="200" y="40" text-anchor="middle">8</text>
  <text class="sv-tk" x="328" y="40" text-anchor="middle">16</text>
  <text class="sv-tk" x="456" y="40" text-anchor="middle">24</text>
  <text class="sv-tk" x="568" y="40" text-anchor="middle">31</text>
  <text class="sv-tk" x="56" y="69" text-anchor="end">0 B</text>
  <rect class="sv-b" x="64" y="48" width="62" height="34" rx="3"/>
  <text class="sv-t" x="95" y="69.5" text-anchor="middle">Version</text>
  <rect class="sv-b" x="128" y="48" width="62" height="34" rx="3"/>
  <text class="sv-t" x="159" y="69.5" text-anchor="middle">IHL</text>
  <rect class="sv-box" x="192" y="48" width="126" height="34" rx="3"/>
  <text class="sv-t" x="255" y="69.5" text-anchor="middle">DSCP/ECN</text>
  <rect class="sv-box" x="320" y="48" width="254" height="34" rx="3"/>
  <text class="sv-t" x="447" y="69.5" text-anchor="middle">Gesamtlänge</text>
  <text class="sv-tk" x="56" y="107" text-anchor="end">4 B</text>
  <rect class="sv-box" x="64" y="86" width="254" height="34" rx="3"/>
  <text class="sv-t" x="191" y="107.5" text-anchor="middle">Identifikation</text>
  <rect class="sv-box" x="320" y="86" width="46" height="34" rx="3"/>
  <text class="sv-t" x="343" y="107.5" text-anchor="middle">Flags</text>
  <rect class="sv-box" x="368" y="86" width="206" height="34" rx="3"/>
  <text class="sv-t" x="471" y="107.5" text-anchor="middle">Fragment-Offset</text>
  <text class="sv-tk" x="56" y="145" text-anchor="end">8 B</text>
  <rect class="sv-c" x="64" y="124" width="126" height="34" rx="3"/>
  <text class="sv-t" x="127" y="145.5" text-anchor="middle">TTL</text>
  <rect class="sv-c" x="192" y="124" width="126" height="34" rx="3"/>
  <text class="sv-t" x="255" y="145.5" text-anchor="middle">Protokoll</text>
  <rect class="sv-box" x="320" y="124" width="254" height="34" rx="3"/>
  <text class="sv-t" x="447" y="145.5" text-anchor="middle">Header-Prüfsumme</text>
  <text class="sv-tk" x="56" y="183" text-anchor="end">12 B</text>
  <rect class="sv-b" x="64" y="162" width="510" height="34" rx="3"/>
  <text class="sv-t" x="319" y="183.5" text-anchor="middle">Quell-IP-Adresse</text>
  <text class="sv-tk" x="56" y="221" text-anchor="end">16 B</text>
  <rect class="sv-b" x="64" y="200" width="510" height="34" rx="3"/>
  <text class="sv-t" x="319" y="221.5" text-anchor="middle">Ziel-IP-Adresse</text>
  <text class="sv-tk" x="56" y="259" text-anchor="end">20 B</text>
  <rect class="sv-ln-d" x="64" y="238" width="510" height="34" rx="3"/>
  <text class="sv-t" x="319" y="259.5" text-anchor="middle">Optionen (selten)</text>
  <text class="sv-tk" x="64" y="298" text-anchor="start">TTL: jeder Router zieht 1 ab, bei 0 wird verworfen · Protokoll: 6 = TCP, 17 = UDP, 1 = ICMP</text>
</svg>
