<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <defs><marker id="leistung-formeln-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <polygon class="sv-a" points="150,30 270,220 30,220"/>
  <line class="sv-ln" x1="70" y1="156" x2="230" y2="156"/>
  <line class="sv-ln" x1="150" y1="156" x2="150" y2="220"/>
  <text class="sv-tb" x="150" y="120" text-anchor="middle">P</text>
  <text class="sv-tb" x="100" y="196" text-anchor="middle">U</text>
  <text class="sv-tb" x="200" y="196" text-anchor="middle">I</text>
  <text class="sv-tk" x="150" y="246" text-anchor="middle">Zuhalten, was gesucht ist:</text>
  <text class="sv-tk" x="150" y="263" text-anchor="middle">P = U · I  |  I = P ÷ U  |  U = P ÷ I</text>
  <text class="sv-tb" x="320" y="44">Beispiel: Server mit Netzteil</text>
  <text class="sv-t" x="320" y="72">Leistungsaufnahme P = 230 V · 1,5 A = 345 W</text>
  <text class="sv-t" x="320" y="94">Laufzeit im Jahr: 24 h · 365 = 8.760 h</text>
  <text class="sv-t" x="320" y="116">Energie E = P · t = 0,345 kW · 8.760 h = 3.022,2 kWh</text>
  <text class="sv-t" x="320" y="138">Kosten = 3.022,2 kWh · 0,30 €/kWh = 906,66 €</text>
  <text class="sv-t" x="320" y="160"></text>
  <text class="sv-t" x="320" y="182">Wirkungsgrad: Ein Netzteil gibt 300 W ab, η = 0,9</text>
  <text class="sv-t" x="320" y="204">→ aufgenommen P_auf = 300 W ÷ 0,9 = 333,3 W</text>
  <text class="sv-t" x="320" y="226">→ Verlust als Wärme: 33,3 W</text>
  <text class="sv-tk" x="20" y="290">Einheiten: Watt (W) für Leistung, Kilowattstunden (kWh) für Energie – W in kW umrechnen: durch 1.000.</text>
</svg>
