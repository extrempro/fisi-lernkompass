<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <defs><marker id="routing-tabelle-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-b" x="20" y="30" width="150" height="54" rx="6"/>
  <text class="sv-tb" x="95.0" y="54.0" text-anchor="middle">Paket an</text>
  <text class="sv-tk" x="95.0" y="70.0" text-anchor="middle">10.1.5.7</text>
  <line class="sv-ln" x1="170" y1="57" x2="216" y2="57" marker-end="url(#routing-tabelle-pf)"/>
  <rect class="sv-box" x="220" y="20" width="330" height="220" rx="8"/>
  <text class="sv-tb" x="385" y="42" text-anchor="middle">Routingtabelle des Routers</text>
  <text class="sv-tk" x="232" y="68">Zielnetz</text>
  <text class="sv-tk" x="352" y="68">Gateway</text>
  <text class="sv-tk" x="436" y="68">passt?</text>
  <rect class="sv-box" x="228" y="78" width="314" height="32" rx="4"/>
  <text class="sv-tc" x="236" y="99">10.0.0.0/8</text>
  <text class="sv-tb" x="356" y="99">R1</text>
  <text class="sv-t" x="436" y="99">ja, 8 Bit</text>
  <rect class="sv-c" x="228" y="116" width="314" height="32" rx="4"/>
  <text class="sv-tc" x="236" y="137">10.1.0.0/16</text>
  <text class="sv-tb" x="356" y="137">R2</text>
  <text class="sv-t" x="436" y="137">ja, 16 Bit</text>
  <rect class="sv-box" x="228" y="154" width="314" height="32" rx="4"/>
  <text class="sv-tc" x="236" y="175">192.168.5.0/24</text>
  <text class="sv-tb" x="356" y="175">R4</text>
  <text class="sv-xe" x="436" y="175">nein</text>
  <rect class="sv-box" x="228" y="192" width="314" height="32" rx="4"/>
  <text class="sv-tc" x="236" y="213">0.0.0.0/0</text>
  <text class="sv-tb" x="356" y="213">R3</text>
  <text class="sv-t" x="436" y="213">ja, 0 Bit</text>
  <text class="sv-tk" x="385" y="254" text-anchor="middle">Longest Prefix Match: der längste passende Präfix gewinnt</text>
  <rect class="sv-box" x="640" y="40" width="100" height="44" rx="6"/>
  <text class="sv-tb" x="690.0" y="59.0" text-anchor="middle">R1</text>
  <text class="sv-tk" x="690.0" y="75.0" text-anchor="middle">10.0.0.0/8</text>
  <rect class="sv-c" x="640" y="110" width="100" height="44" rx="6"/>
  <text class="sv-tb" x="690.0" y="129.0" text-anchor="middle">R2</text>
  <text class="sv-tk" x="690.0" y="145.0" text-anchor="middle">10.1.0.0/16</text>
  <rect class="sv-box" x="640" y="180" width="100" height="44" rx="6"/>
  <text class="sv-tb" x="690.0" y="199.0" text-anchor="middle">R3</text>
  <text class="sv-tk" x="690.0" y="215.0" text-anchor="middle">Default-Route</text>
  <path class="sv-ln-c" d="M542 133 C 590 133 600 132 638 132" marker-end="url(#routing-tabelle-pf)"/>
  <text class="sv-tb" x="20" y="120">Ablauf:</text>
  <text class="sv-tk" x="20" y="142">1. Alle Einträge prüfen:</text>
  <text class="sv-tk" x="20" y="159">   liegt 10.1.5.7 im Zielnetz?</text>
  <text class="sv-tk" x="20" y="176">2. Von den passenden den mit</text>
  <text class="sv-tk" x="20" y="193">   dem längsten Präfix nehmen</text>
  <text class="sv-tk" x="20" y="210">3. Kein Treffer außer /0:</text>
  <text class="sv-tk" x="20" y="227">   Default-Route</text>
  <text class="sv-tk" x="20" y="300">Ohne passenden Eintrag und ohne Default-Route verwirft der Router das Paket und meldet per ICMP „Destination unreachable“.</text>
</svg>
