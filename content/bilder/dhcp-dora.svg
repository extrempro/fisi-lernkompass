<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470">
  <defs><marker id="dhcp-dora-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-box" x="40" y="12" width="160" height="50" rx="6"/>
  <text class="sv-tb" x="120" y="34" text-anchor="middle">Client</text>
  <text class="sv-tk" x="120" y="50" text-anchor="middle">noch ohne IP-Adresse</text>
  <rect class="sv-a" x="560" y="12" width="160" height="50" rx="6"/>
  <text class="sv-tb" x="640" y="34" text-anchor="middle">DHCP-Server</text>
  <text class="sv-tk" x="640" y="50" text-anchor="middle">192.168.1.1</text>
  <line class="sv-ln-d" x1="120" y1="62" x2="120" y2="300"/>
  <line class="sv-ln-d" x1="640" y1="62" x2="640" y2="300"/>
  <line class="sv-ln" x1="122" y1="96" x2="636" y2="96" marker-end="url(#dhcp-dora-pf)"/>
  <circle class="sv-c" cx="380" cy="96" r="11"/><text class="sv-tb" x="380" y="100" text-anchor="middle">1</text>
  <text class="sv-tb" x="150" y="88">Discover</text>
  <text class="sv-tk" x="150" y="114">0.0.0.0:68 → 255.255.255.255:67 · „Gibt es hier einen DHCP-Server?“</text>
  <line class="sv-ln-a" x1="638" y1="150" x2="124" y2="150" marker-end="url(#dhcp-dora-pf)"/>
  <circle class="sv-c" cx="380" cy="150" r="11"/><text class="sv-tb" x="380" y="154" text-anchor="middle">2</text>
  <text class="sv-tb" x="610" y="142" text-anchor="end">Offer</text>
  <text class="sv-tk" x="610" y="168" text-anchor="end">Angebot: 192.168.1.120/24, Gateway, DNS, Lease 8 Tage</text>
  <line class="sv-ln" x1="122" y1="204" x2="636" y2="204" marker-end="url(#dhcp-dora-pf)"/>
  <circle class="sv-c" cx="380" cy="204" r="11"/><text class="sv-tb" x="380" y="208" text-anchor="middle">3</text>
  <text class="sv-tb" x="150" y="196">Request</text>
  <text class="sv-tk" x="150" y="222">Broadcast: „Ich nehme 192.168.1.120 von Server 192.168.1.1“</text>
  <line class="sv-ln-a" x1="638" y1="258" x2="124" y2="258" marker-end="url(#dhcp-dora-pf)"/>
  <circle class="sv-c" cx="380" cy="258" r="11"/><text class="sv-tb" x="380" y="262" text-anchor="middle">4</text>
  <text class="sv-tb" x="610" y="250" text-anchor="end">Acknowledge</text>
  <text class="sv-tk" x="610" y="276" text-anchor="end">Bestätigt – der Client darf die Adresse jetzt nutzen</text>
  <text class="sv-tb" x="40" y="336">Lebenszyklus einer Lease</text>
  <rect class="sv-b" x="40" y="350" width="340" height="34" rx="4"/>
  <rect class="sv-c" x="380" y="350" width="255" height="34" rx="4"/>
  <rect class="sv-d" x="635" y="350" width="85" height="34" rx="4"/>
  <text class="sv-t" x="210" y="372" text-anchor="middle">Adresse wird genutzt</text>
  <text class="sv-t" x="507" y="372" text-anchor="middle">Renewing: Unicast an „seinen“ Server</text>
  <text class="sv-t" x="677" y="372" text-anchor="middle">Rebinding</text>
  <text class="sv-tk" x="40" y="402">0 %</text>
  <text class="sv-tk" x="380" y="402" text-anchor="middle">T1 = 50 %</text>
  <text class="sv-tk" x="635" y="402" text-anchor="middle">T2 = 87,5 %</text>
  <text class="sv-tk" x="720" y="402" text-anchor="end">100 %</text>
  <text class="sv-tk" x="40" y="428">Antwortet bis T2 niemand, fragt der Client per Broadcast jeden DHCP-Server (Rebinding).</text>
  <text class="sv-tk" x="40" y="446">Läuft die Lease ganz ab, muss er die Adresse abgeben und mit Discover von vorn beginnen.</text>
</svg>
