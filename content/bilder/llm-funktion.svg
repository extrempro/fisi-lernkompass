<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250">
  <defs><marker id="llm-funktion-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="sv-tb" x="340" y="20" text-anchor="middle">Ein Sprachmodell sagt Wort für Wort das wahrscheinlichste nächste Token voraus</text>
  <rect class="sv-box" x="14" y="50" width="150" height="64" rx="6"/>
  <text class="sv-tb" x="89" y="80" text-anchor="middle">Eingabe (Prompt)</text>
  <text class="sv-tk" x="89" y="94" text-anchor="middle">„Der Drucker druckt …“</text>
  <line class="sv-ln" x1="166" y1="82" x2="196" y2="82" marker-end="url(#llm-funktion-pf)"/>
  <rect class="sv-box" x="198" y="50" width="120" height="64" rx="6"/>
  <text class="sv-tb" x="258" y="80" text-anchor="middle">Tokens</text>
  <text class="sv-tk" x="258" y="94" text-anchor="middle">Der | Druck | er | …</text>
  <line class="sv-ln" x1="320" y1="82" x2="350" y2="82" marker-end="url(#llm-funktion-pf)"/>
  <rect class="sv-a" x="352" y="40" width="140" height="84" rx="6"/>
  <text class="sv-tb" x="422" y="80" text-anchor="middle">Sprachmodell</text>
  <text class="sv-tk" x="422" y="94" text-anchor="middle">Milliarden Parameter</text>
  <line class="sv-ln" x1="494" y1="82" x2="524" y2="82" marker-end="url(#llm-funktion-pf)"/>
  <rect class="sv-box" x="526" y="40" width="140" height="100" rx="8"/>
  <text class="sv-tb" x="596" y="60" text-anchor="middle">nächstes Token</text>
  <text class="sv-t" x="538" y="82" text-anchor="start">nicht</text>
  <rect class="sv-a" x="600" y="72" width="56" height="12" rx="2"/>
  <text class="sv-t" x="538" y="104" text-anchor="start">schwarz</text>
  <rect class="sv-a" x="600" y="94" width="18.9677" height="12" rx="2"/>
  <text class="sv-t" x="538" y="126" text-anchor="start">leise</text>
  <rect class="sv-a" x="600" y="116" width="8.12903" height="12" rx="2"/>
  <path class="sv-ln-d" d="M596 142 V186 H422 V126" marker-end="url(#llm-funktion-pf)"/>
  <text class="sv-tk" x="509" y="204" text-anchor="middle">gewähltes Token wird angehängt – nächste Runde</text>
  <text class="sv-tb" x="14" y="160" text-anchor="start">Kontextfenster:</text>
  <text class="sv-tk" x="14" y="178" text-anchor="start">alles, was das Modell gleichzeitig</text>
  <text class="sv-tk" x="14" y="194" text-anchor="start">„sieht“ – Prompt, Verlauf, Dokumente</text>
  <text class="sv-tk" x="340" y="238" text-anchor="middle">Das Modell „weiß“ nichts nachzuschlagen – es rechnet Wahrscheinlichkeiten. Daher klingen falsche Antworten oft überzeugend.</text>
</svg>
