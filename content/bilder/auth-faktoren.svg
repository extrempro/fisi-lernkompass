<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <defs><marker id="auth-faktoren-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="sv-tb" x="20" y="24">Die drei Faktorkategorien</text>
  <rect class="sv-a" x="20" y="40" width="230" height="52" rx="6"/>
  <text class="sv-tb" x="135.0" y="63.0" text-anchor="middle">Wissen</text>
  <text class="sv-tk" x="135.0" y="79.0" text-anchor="middle">etwas, das ich weiß</text>
  <text class="sv-t" x="34" y="116">· Passwort</text>
  <text class="sv-t" x="34" y="134">· PIN</text>
  <text class="sv-t" x="34" y="152">· Sicherheitsfrage</text>
  <rect class="sv-b" x="265" y="40" width="230" height="52" rx="6"/>
  <text class="sv-tb" x="380.0" y="63.0" text-anchor="middle">Besitz</text>
  <text class="sv-tk" x="380.0" y="79.0" text-anchor="middle">etwas, das ich habe</text>
  <text class="sv-t" x="279" y="116">· Smartphone mit App</text>
  <text class="sv-t" x="279" y="134">· FIDO2-Schlüssel</text>
  <text class="sv-t" x="279" y="152">· Smartcard</text>
  <rect class="sv-c" x="510" y="40" width="230" height="52" rx="6"/>
  <text class="sv-tb" x="625.0" y="63.0" text-anchor="middle">Inhärenz</text>
  <text class="sv-tk" x="625.0" y="79.0" text-anchor="middle">etwas, das ich bin</text>
  <text class="sv-t" x="524" y="116">· Fingerabdruck</text>
  <text class="sv-t" x="524" y="134">· Gesicht</text>
  <text class="sv-t" x="524" y="152">· Iris</text>
  <text class="sv-tb" x="20" y="200">MFA heißt: mindestens zwei verschiedene Kategorien</text>
  <rect class="sv-c" x="20" y="216" width="230" height="44" rx="6"/>
  <text class="sv-tb" x="135.0" y="235.0" text-anchor="middle">Passwort + App-Code</text>
  <text class="sv-tk" x="135.0" y="251.0" text-anchor="middle">Wissen + Besitz → MFA ✓</text>
  <rect class="sv-c" x="265" y="216" width="230" height="44" rx="6"/>
  <text class="sv-tb" x="380.0" y="235.0" text-anchor="middle">Smartcard + PIN</text>
  <text class="sv-tk" x="380.0" y="251.0" text-anchor="middle">Besitz + Wissen → MFA ✓</text>
  <rect class="sv-e" x="510" y="216" width="230" height="44" rx="6"/>
  <text class="sv-tb" x="625.0" y="235.0" text-anchor="middle">Passwort + Sicherheitsfrage</text>
  <text class="sv-tk" x="625.0" y="251.0" text-anchor="middle">zweimal Wissen → keine MFA</text>
  <text class="sv-tk" x="20" y="292">Phishing-resistent sind Verfahren, die an die echte Adresse gebunden sind (FIDO2/Passkeys, Smartcard).</text>
  <text class="sv-tk" x="20" y="309">Codes per SMS oder App kann ein Angreifer auf einer gefälschten Seite mit abgreifen.</text>
</svg>
