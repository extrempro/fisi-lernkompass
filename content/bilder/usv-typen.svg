<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490">
  <defs><marker id="usv-typen-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="sv-tb" x="20" y="24">Offline / Standby (VFD)</text>
  <rect class="sv-box" x="20" y="36" width="80" height="40" rx="6"/>
  <text class="sv-t" x="60.0" y="61.0" text-anchor="middle">Netz</text>
  <rect class="sv-d" x="660" y="36" width="80" height="40" rx="6"/>
  <text class="sv-t" x="700.0" y="61.0" text-anchor="middle">Server</text>
  <line class="sv-ln-a" x1="100" y1="56" x2="560" y2="56" marker-end="url(#usv-typen-pf)"/>
  <rect class="sv-box" x="560" y="36" width="60" height="40" rx="6"/>
  <text class="sv-tk" x="590.0" y="61.0" text-anchor="middle">Schalter</text>
  <line class="sv-ln-a" x1="620" y1="56" x2="658" y2="56" marker-end="url(#usv-typen-pf)"/>
  <rect class="sv-b" x="140" y="86" width="90" height="30" rx="6"/>
  <text class="sv-tk" x="185.0" y="106.0" text-anchor="middle">Akku</text>
  <rect class="sv-c" x="260" y="86" width="130" height="30" rx="6"/>
  <text class="sv-tk" x="325.0" y="106.0" text-anchor="middle">Wechselrichter</text>
  <line class="sv-ln-d" x1="230" y1="101" x2="260" y2="101" marker-end="url(#usv-typen-pf)"/>
  <path class="sv-ln-d" d="M390 101 L590 101 L590 78" marker-end="url(#usv-typen-pf)"/>
  <text class="sv-tk" x="400" y="94">nur bei Ausfall</text>
  <text class="sv-tk" x="20" y="136">Normalbetrieb: Der Strom geht direkt durch. Bei Ausfall schaltet die USV</text>
  <text class="sv-tk" x="20" y="153">auf Akku und Wechselrichter um – mit einigen Millisekunden Umschaltzeit.</text>
  <text class="sv-tb" x="20" y="186">Line-Interactive (VI)</text>
  <rect class="sv-box" x="20" y="198" width="80" height="40" rx="6"/>
  <text class="sv-t" x="60.0" y="223.0" text-anchor="middle">Netz</text>
  <rect class="sv-d" x="660" y="198" width="80" height="40" rx="6"/>
  <text class="sv-t" x="700.0" y="223.0" text-anchor="middle">Server</text>
  <rect class="sv-c" x="300" y="198" width="120" height="40" rx="6"/>
  <text class="sv-t" x="360.0" y="223.0" text-anchor="middle">Regeltrafo</text>
  <line class="sv-ln-a" x1="100" y1="218" x2="300" y2="218" marker-end="url(#usv-typen-pf)"/>
  <line class="sv-ln-a" x1="420" y1="218" x2="560" y2="218" marker-end="url(#usv-typen-pf)"/>
  <rect class="sv-box" x="560" y="198" width="60" height="40" rx="6"/>
  <text class="sv-tk" x="590.0" y="223.0" text-anchor="middle">Schalter</text>
  <line class="sv-ln-a" x1="620" y1="218" x2="658" y2="218" marker-end="url(#usv-typen-pf)"/>
  <rect class="sv-b" x="140" y="248" width="90" height="30" rx="6"/>
  <text class="sv-tk" x="185.0" y="268.0" text-anchor="middle">Akku</text>
  <rect class="sv-c" x="260" y="248" width="130" height="30" rx="6"/>
  <text class="sv-tk" x="325.0" y="268.0" text-anchor="middle">Wechselrichter</text>
  <line class="sv-ln-d" x1="230" y1="263" x2="260" y2="263" marker-end="url(#usv-typen-pf)"/>
  <path class="sv-ln-d" d="M390 263 L590 263 L590 240" marker-end="url(#usv-typen-pf)"/>
  <text class="sv-tk" x="400" y="256">nur bei Ausfall</text>
  <text class="sv-tk" x="20" y="298">Wie Offline, zusätzlich gleicht ein Regeltransformator Über- und</text>
  <text class="sv-tk" x="20" y="315">Unterspannung aus, ohne den Akku zu belasten.</text>
  <text class="sv-tb" x="20" y="348">Online / Doppelwandler (VFI)</text>
  <rect class="sv-box" x="20" y="360" width="80" height="40" rx="6"/>
  <text class="sv-t" x="60.0" y="385.0" text-anchor="middle">Netz</text>
  <rect class="sv-d" x="660" y="360" width="80" height="40" rx="6"/>
  <text class="sv-t" x="700.0" y="385.0" text-anchor="middle">Server</text>
  <rect class="sv-c" x="140" y="360" width="120" height="40" rx="6"/>
  <text class="sv-t" x="200.0" y="385.0" text-anchor="middle">Gleichrichter</text>
  <rect class="sv-b" x="300" y="360" width="100" height="40" rx="6"/>
  <text class="sv-t" x="350.0" y="385.0" text-anchor="middle">Akku</text>
  <rect class="sv-c" x="440" y="360" width="130" height="40" rx="6"/>
  <text class="sv-t" x="505.0" y="385.0" text-anchor="middle">Wechselrichter</text>
  <line class="sv-ln-a" x1="100" y1="380" x2="140" y2="380" marker-end="url(#usv-typen-pf)"/>
  <line class="sv-ln-a" x1="260" y1="380" x2="300" y2="380" marker-end="url(#usv-typen-pf)"/>
  <line class="sv-ln-a" x1="400" y1="380" x2="440" y2="380" marker-end="url(#usv-typen-pf)"/>
  <line class="sv-ln-a" x1="570" y1="380" x2="660" y2="380" marker-end="url(#usv-typen-pf)"/>
  <text class="sv-tk" x="20" y="428">Die Last hängt immer am Wechselrichter: Netz → Gleichrichter → Akku → Wechselrichter.</text>
  <text class="sv-tk" x="20" y="445">Keine Umschaltzeit, saubere Spannung – für Rechenzentrum und kritische Server.</text>
</svg>
