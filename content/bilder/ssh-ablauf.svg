<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440">
  <defs><marker id="ssh-ablauf-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-box" x="40" y="12" width="190" height="62" rx="6"/>
  <text class="sv-tb" x="135" y="34" text-anchor="middle">SSH-Client</text>
  <text class="sv-tk" x="135" y="50" text-anchor="middle">~/.ssh/id_ed25519 (privat)</text>
  <text class="sv-tk" x="135" y="64" text-anchor="middle">~/.ssh/known_hosts</text>
  <rect class="sv-a" x="530" y="12" width="190" height="62" rx="6"/>
  <text class="sv-tb" x="625" y="34" text-anchor="middle">SSH-Server (sshd)</text>
  <text class="sv-tk" x="625" y="50" text-anchor="middle">Host-Key des Servers</text>
  <text class="sv-tk" x="625" y="64" text-anchor="middle">~/.ssh/authorized_keys</text>
  <line class="sv-ln-d" x1="135" y1="74" x2="135" y2="342"/>
  <line class="sv-ln-d" x1="625" y1="74" x2="625" y2="342"/>
  <line class="sv-ln" x1="137" y1="108" x2="621" y2="108" marker-end="url(#ssh-ablauf-pf)" marker-start="url(#ssh-ablauf-pf)"/>
  <circle class="sv-c" cx="110" cy="108" r="11"/><text class="sv-tb" x="110" y="112" text-anchor="middle">1</text>
  <text class="sv-tb" x="160" y="100">TCP 22, Versionen und Verfahren aushandeln</text>
  <line class="sv-ln" x1="137" y1="160" x2="621" y2="160" marker-end="url(#ssh-ablauf-pf)" marker-start="url(#ssh-ablauf-pf)"/>
  <circle class="sv-c" cx="110" cy="160" r="11"/><text class="sv-tb" x="110" y="164" text-anchor="middle">2</text>
  <text class="sv-tb" x="160" y="152">Schlüsselaustausch (Diffie-Hellman)</text>
  <text class="sv-tk" x="160" y="178">Beide berechnen denselben Sitzungsschlüssel – ab jetzt verschlüsselt</text>
  <line class="sv-ln-a" x1="623" y1="218" x2="139" y2="218" marker-end="url(#ssh-ablauf-pf)"/>
  <circle class="sv-c" cx="110" cy="218" r="11"/><text class="sv-tb" x="110" y="222" text-anchor="middle">3</text>
  <text class="sv-tb" x="600" y="210" text-anchor="end">Server weist sich mit seinem Host-Key aus</text>
  <text class="sv-tk" x="600" y="236" text-anchor="end">Client vergleicht den Fingerabdruck mit known_hosts (beim ersten Mal: nachfragen)</text>
  <line class="sv-ln" x1="137" y1="276" x2="621" y2="276" marker-end="url(#ssh-ablauf-pf)"/>
  <circle class="sv-c" cx="110" cy="276" r="11"/><text class="sv-tb" x="110" y="280" text-anchor="middle">4</text>
  <text class="sv-tb" x="160" y="268">Benutzer meldet sich an</text>
  <text class="sv-tk" x="160" y="294">Client signiert mit seinem privaten Schlüssel, Server prüft per authorized_keys</text>
  <line class="sv-ln-e" x1="137" y1="326" x2="621" y2="326" marker-end="url(#ssh-ablauf-pf)" marker-start="url(#ssh-ablauf-pf)"/>
  <circle class="sv-c" cx="110" cy="326" r="11"/><text class="sv-tb" x="110" y="330" text-anchor="middle">5</text>
  <text class="sv-tb" x="160" y="318">Verschlüsselte Sitzung: Shell, SFTP/SCP, Tunnel</text>
  <text class="sv-tk" x="40" y="376">Zwei Schlüsselpaare, zwei Aufgaben: Der Host-Key beweist „das ist wirklich der Server“,</text>
  <text class="sv-tk" x="40" y="394">das Benutzer-Schlüsselpaar beweist „das ist wirklich der Benutzer“. Der private Schlüssel verlässt nie den Client.</text>
  <text class="sv-tk" x="40" y="420">Warnung „REMOTE HOST IDENTIFICATION HAS CHANGED“: Server neu installiert – oder ein Angreifer sitzt dazwischen. Erst klären!</text>
</svg>
