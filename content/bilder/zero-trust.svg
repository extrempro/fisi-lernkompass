<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300">
  <defs><marker id="zero-trust-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="sv-tb" x="150" y="20" text-anchor="middle">Klassisch: Burg und Graben</text>
