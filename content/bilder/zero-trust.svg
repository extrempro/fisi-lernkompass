  <line class="sv-ln" x1="140" y1="104" x2="160" y2="104" marker-end="url(#zero-trust-pf)" marker-start="url(#zero-trust-pf)"/>
  <line class="sv-ln" x1="140" y1="164" x2="160" y2="164" marker-end="url(#zero-trust-pf)" marker-start="url(#zero-trust-pf)"/>
