  <rect class="sv-a" x="427.186" y="83" width="184" height="52" rx="6"/>
  <text class="sv-tb" x="519.186" y="107" text-anchor="middle">2. Ursache vermuten</text>
  <text class="sv-tk" x="519.186" y="121" text-anchor="middle">Was hat sich geändert?</text>
  <rect class="sv-a" x="427.186" y="201" width="184" height="52" rx="6"/>
  <text class="sv-tb" x="519.186" y="225" text-anchor="middle">3. Vermutung testen</text>
  <text class="sv-tk" x="519.186" y="239" text-anchor="middle">eine Änderung nach der anderen</text>
  <rect class="sv-c" x="228" y="260" width="184" height="52" rx="6"/>
  <text class="sv-tb" x="320" y="284" text-anchor="middle">4. Lösung umsetzen</text>
  <text class="sv-tk" x="320" y="298" text-anchor="middle">mit Plan, ggf. als Change</text>
  <rect class="sv-b" x="28.8142" y="201" width="184" height="52" rx="6"/>
  <text class="sv-tb" x="120.814" y="225" text-anchor="middle">5. Ergebnis prüfen</text>
  <text class="sv-tk" x="120.814" y="239" text-anchor="middle">läuft alles? Folgen?</text>
