  <text class="sv-tb" x="75.0" y="298.0" text-anchor="middle">Notebook</text>
  <text class="sv-tk" x="75.0" y="314.0" text-anchor="middle">VPN-Client</text>
  <rect class="sv-c" x="530" y="276" width="100" height="50" rx="6"/>
  <text class="sv-tb" x="580.0" y="298.0" text-anchor="middle">Firewall</text>
  <text class="sv-tk" x="580.0" y="314.0" text-anchor="middle">VPN-Gateway</text>
  <rect class="sv-box" x="650" y="276" width="90" height="50" rx="6"/>
  <text class="sv-tb" x="695.0" y="298.0" text-anchor="middle">Firmennetz</text>
  <text class="sv-tk" x="695.0" y="314.0" text-anchor="middle">Server, Dateien</text>
  <line class="sv-ln" x1="630" y1="301" x2="650" y2="301"/>
  <rect class="sv-a" x="130" y="288" width="400" height="26" rx="13"/>
  <text class="sv-xa" x="330" y="306" text-anchor="middle">Tunnel für Firmenverkehr</text>
  <path class="sv-ln-d" d="M75 326 C 75 362 200 358 298 358" marker-end="url(#vpn-arten-pf)"/>
  <rect class="sv-box" x="300" y="338" width="160" height="40" rx="6"/>
  <text class="sv-tb" x="380.0" y="363.0" text-anchor="middle">Webseiten im Internet</text>
  <text class="sv-tk" x="20" y="412">Split Tunneling: Internetverkehr geht direkt, nur Firmenverkehr durch den Tunnel.</text>
  <text class="sv-tk" x="20" y="428">Full Tunnel: alles läuft durch den Tunnel und die Firewall der Firma.</text>
