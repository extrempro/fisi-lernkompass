  <text class="sv-tk" x="380.0" y="66" text-anchor="middle">Internet (unsicher)</text>
  <rect class="sv-box" x="20" y="70" width="90" height="46" rx="6"/>
  <text class="sv-tb" x="65.0" y="90.0" text-anchor="middle">LAN A</text>
  <text class="sv-tk" x="65.0" y="106.0" text-anchor="middle">10.1.0.0/16</text>
  <rect class="sv-c" x="130" y="70" width="100" height="46" rx="6"/>
  <text class="sv-tb" x="180.0" y="90.0" text-anchor="middle">Firewall A</text>
  <text class="sv-tk" x="180.0" y="106.0" text-anchor="middle">VPN-Gateway</text>
  <rect class="sv-c" x="530" y="70" width="100" height="46" rx="6"/>
  <text class="sv-tb" x="580.0" y="90.0" text-anchor="middle">Firewall B</text>
  <text class="sv-tk" x="580.0" y="106.0" text-anchor="middle">VPN-Gateway</text>
  <rect class="sv-box" x="650" y="70" width="90" height="46" rx="6"/>
  <text class="sv-tb" x="695.0" y="90.0" text-anchor="middle">LAN B</text>
  <text class="sv-tk" x="695.0" y="106.0" text-anchor="middle">10.2.0.0/16</text>
  <line class="sv-ln" x1="110" y1="93" x2="130" y2="93"/>
  <line class="sv-ln" x1="630" y1="93" x2="650" y2="93"/>
  <rect class="sv-a" x="230" y="80" width="300" height="26" rx="13"/>
  <text class="sv-xa" x="380" y="98" text-anchor="middle">verschlüsselter Tunnel (IPsec)</text>
  <text class="sv-tk" x="380" y="138" text-anchor="middle">Außen: öffentliche IPs der Firewalls</text>
  <text class="sv-tk" x="380" y="154" text-anchor="middle">Innen: privates Paket, verschlüsselt verpackt</text>
  <text class="sv-tb" x="20" y="226">Remote Access (Client-to-Site): einzelne Geräte ins Firmennetz</text>
  <ellipse class="sv-box" cx="380.0" cy="321.0" rx="170.0" ry="75.0" stroke-dasharray="6 4"/>
  <text class="sv-tk" x="380.0" y="266" text-anchor="middle">Internet (unsicher)</text>
