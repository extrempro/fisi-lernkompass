<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 284">
  <text class="sv-tb" x="64" y="18" text-anchor="start">TCP-Header (mindestens 20 Byte)</text>
  <text class="sv-tk" x="72" y="40" text-anchor="middle">0</text>
  <text class="sv-tk" x="200" y="40" text-anchor="middle">8</text>
  <text class="sv-tk" x="328" y="40" text-anchor="middle">16</text>
  <text class="sv-tk" x="456" y="40" text-anchor="middle">24</text>
  <text class="sv-tk" x="568" y="40" text-anchor="middle">31</text>
  <text class="sv-tk" x="56" y="69" text-anchor="end">0 B</text>
  <rect class="sv-c" x="64" y="48" width="254" height="34" rx="3"/>
  <text class="sv-t" x="191" y="69.5" text-anchor="middle">Quellport</text>
  <rect class="sv-c" x="320" y="48" width="254" height="34" rx="3"/>
  <text class="sv-t" x="447" y="69.5" text-anchor="middle">Zielport</text>
  <text class="sv-tk" x="56" y="107" text-anchor="end">4 B</text>
  <rect class="sv-box" x="64" y="86" width="510" height="34" rx="3"/>
  <text class="sv-t" x="319" y="107.5" text-anchor="middle">Sequenznummer</text>
  <text class="sv-tk" x="56" y="145" text-anchor="end">8 B</text>
  <rect class="sv-box" x="64" y="124" width="510" height="34" rx="3"/>
  <text class="sv-t" x="319" y="145.5" text-anchor="middle">Bestätigungsnummer (ACK)</text>
  <text class="sv-tk" x="56" y="183" text-anchor="end">12 B</text>
  <rect class="sv-box" x="64" y="162" width="62" height="34" rx="3"/>
  <text class="sv-t" x="95" y="183.5" text-anchor="middle">Offset</text>
  <rect class="sv-box" x="128" y="162" width="62" height="34" rx="3"/>
  <text class="sv-t" x="159" y="183.5" text-anchor="middle">res.</text>
  <rect class="sv-e" x="192" y="162" width="126" height="34" rx="3"/>
  <text class="sv-t" x="255" y="183.5" text-anchor="middle">Flags</text>
  <rect class="sv-box" x="320" y="162" width="254" height="34" rx="3"/>
  <text class="sv-t" x="447" y="183.5" text-anchor="middle">Fenstergröße</text>
  <text class="sv-tk" x="56" y="221" text-anchor="end">16 B</text>
  <rect class="sv-box" x="64" y="200" width="254" height="34" rx="3"/>
  <text class="sv-t" x="191" y="221.5" text-anchor="middle">Prüfsumme</text>
  <rect class="sv-box" x="320" y="200" width="254" height="34" rx="3"/>
  <text class="sv-t" x="447" y="221.5" text-anchor="middle">Urgent-Pointer</text>
  <text class="sv-tk" x="64" y="260" text-anchor="start">Flags: SYN = Aufbau, ACK = Bestätigung, FIN = Abbau, RST = Abbruch</text>
</svg>
