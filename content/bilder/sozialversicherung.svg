<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330">
  <defs><marker id="sozialversicherung-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <text class="sv-tb" x="20" y="24">Die fünf Säulen der Sozialversicherung (Beitragssätze 2026)</text>
  <rect class="sv-box" x="20" y="40" width="720" height="30" rx="4"/>
  <text class="sv-tb" x="380" y="60" text-anchor="middle">Soziale Sicherung</text>
  <rect class="sv-a" x="30" y="78" width="124" height="150" rx="4"/>
  <text class="sv-tb" x="92" y="104" text-anchor="middle">Renten-</text>
  <text class="sv-tb" x="92" y="120" text-anchor="middle">versicherung</text>
  <text class="sv-tk" x="92" y="156" text-anchor="middle">Arbeitnehmer</text>
  <text class="sv-t" x="92" y="172" text-anchor="middle">9,3 %</text>
  <text class="sv-tk" x="92" y="198" text-anchor="middle">Arbeitgeber</text>
  <text class="sv-t" x="92" y="214" text-anchor="middle">9,3 %</text>
  <rect class="sv-b" x="174" y="78" width="124" height="150" rx="4"/>
  <text class="sv-tb" x="236" y="104" text-anchor="middle">Kranken-</text>
  <text class="sv-tb" x="236" y="120" text-anchor="middle">versicherung</text>
  <text class="sv-tk" x="236" y="156" text-anchor="middle">Arbeitnehmer</text>
  <text class="sv-t" x="236" y="172" text-anchor="middle">7,3 % + ½ Zus.</text>
  <text class="sv-tk" x="236" y="198" text-anchor="middle">Arbeitgeber</text>
  <text class="sv-t" x="236" y="214" text-anchor="middle">7,3 % + ½ Zus.</text>
  <rect class="sv-c" x="318" y="78" width="124" height="150" rx="4"/>
  <text class="sv-tb" x="380" y="104" text-anchor="middle">Pflege-</text>
  <text class="sv-tb" x="380" y="120" text-anchor="middle">versicherung</text>
  <text class="sv-tk" x="380" y="156" text-anchor="middle">Arbeitnehmer</text>
  <text class="sv-t" x="380" y="172" text-anchor="middle">1,8 %*</text>
  <text class="sv-tk" x="380" y="198" text-anchor="middle">Arbeitgeber</text>
  <text class="sv-t" x="380" y="214" text-anchor="middle">1,8 %</text>
  <rect class="sv-d" x="462" y="78" width="124" height="150" rx="4"/>
  <text class="sv-tb" x="524" y="104" text-anchor="middle">Arbeitslosen-</text>
  <text class="sv-tb" x="524" y="120" text-anchor="middle">versicherung</text>
  <text class="sv-tk" x="524" y="156" text-anchor="middle">Arbeitnehmer</text>
  <text class="sv-t" x="524" y="172" text-anchor="middle">1,3 %</text>
  <text class="sv-tk" x="524" y="198" text-anchor="middle">Arbeitgeber</text>
  <text class="sv-t" x="524" y="214" text-anchor="middle">1,3 %</text>
  <rect class="sv-e" x="606" y="78" width="124" height="150" rx="4"/>
  <text class="sv-tb" x="668" y="104" text-anchor="middle">Unfall-</text>
  <text class="sv-tb" x="668" y="120" text-anchor="middle">versicherung</text>
  <text class="sv-tk" x="668" y="156" text-anchor="middle">Arbeitnehmer</text>
  <text class="sv-t" x="668" y="172" text-anchor="middle">0 %</text>
  <text class="sv-tk" x="668" y="198" text-anchor="middle">Arbeitgeber</text>
  <text class="sv-t" x="668" y="214" text-anchor="middle">100 %</text>
  <rect class="sv-box" x="20" y="236" width="720" height="26" rx="2"/>
  <text class="sv-tk" x="380" y="254" text-anchor="middle">Finanziert durch Beiträge auf den Bruttolohn (bis zur Beitragsbemessungsgrenze)</text>
  <text class="sv-tk" x="20" y="286">* Kinderlose ab 23 Jahren zahlen 0,6 % mehr. Die Unfallversicherung (Berufsgenossenschaft) zahlt allein der Arbeitgeber.</text>
  <text class="sv-tk" x="20" y="304">Der Zusatzbeitrag der Krankenkasse unterscheidet sich je Kasse und wird geteilt.</text>
</svg>
