  <text class="sv-tk" x="526" y="228" text-anchor="middle">Grafikkarte</text>
  <text class="sv-t" x="526" y="254" text-anchor="middle">Grafik</text>
  <line class="sv-ln-d" x1="475" y1="146" x2="526" y2="170"/>
  <rect class="sv-b" x="586" y="172" width="104" height="96" rx="6"/>
  <text class="sv-tb" x="638" y="192" text-anchor="middle">HBM3e</text>
  <text class="sv-tk" x="638" y="214" text-anchor="middle">gestapelt</text>
  <text class="sv-tk" x="638" y="228" text-anchor="middle">neben dem Chip</text>
  <text class="sv-t" x="638" y="254" text-anchor="middle">KI-Rechner</text>
  <line class="sv-ln-d" x1="475" y1="146" x2="638" y2="170"/>
  <text class="sv-tk" x="350" y="292" text-anchor="middle">Alle Arten sind flüchtig: ohne Strom ist der Inhalt weg.</text>
