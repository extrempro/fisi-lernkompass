  <text class="sv-tk" x="302" y="228" text-anchor="middle">SO-DIMM</text>
  <text class="sv-t" x="302" y="254" text-anchor="middle">PCs, Server</text>
  <line class="sv-ln-d" x1="475" y1="146" x2="302" y2="170"/>
  <rect class="sv-b" x="362" y="172" width="104" height="96" rx="6"/>
