  <line class="sv-ln" x1="360" y1="54" x2="475" y2="90" marker-end="url(#ram-arten-pf)"/>
  <rect class="sv-box" x="30" y="176" width="190" height="44" rx="6"/>
  <text class="sv-t" x="125" y="202.5" text-anchor="middle">Cache in der CPU</text>
  <line class="sv-ln" x1="125" y1="146" x2="125" y2="174" marker-end="url(#ram-arten-pf)"/>
  <rect class="sv-b" x="250" y="172" width="104" height="96" rx="6"/>
  <text class="sv-tb" x="302" y="192" text-anchor="middle">DDR4 / DDR5</text>
