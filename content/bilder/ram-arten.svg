  <text class="sv-tk" x="414" y="214" text-anchor="middle">aufgelötet</text>
  <text class="sv-tk" x="414" y="228" text-anchor="middle">oder LPCAMM2</text>
  <text class="sv-t" x="414" y="254" text-anchor="middle">Notebooks</text>
  <line class="sv-ln-d" x1="475" y1="146" x2="414" y2="170"/>
  <rect class="sv-b" x="474" y="172" width="104" height="96" rx="6"/>
  <text class="sv-tb" x="526" y="192" text-anchor="middle">GDDR6 / 7</text>
