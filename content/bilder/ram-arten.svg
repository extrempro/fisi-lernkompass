<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300">
  <defs><marker id="ram-arten-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-box" x="260" y="12" width="150" height="40" rx="6"/>
  <text class="sv-tb" x="335" y="36.5" text-anchor="middle">Halbleiter-RAM</text>
