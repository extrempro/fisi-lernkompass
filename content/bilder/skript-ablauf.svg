  <text class="sv-tk" x="563" y="108" text-anchor="middle">Ergebnis prüfen</text>
  <line class="sv-ln" x1="622" y1="86" x2="628" y2="86" marker-end="url(#skript-ablauf-pf)"/>
  <rect class="sv-box" x="630" y="40" width="114" height="92" rx="8"/>
  <text class="sv-tb" x="687" y="64" text-anchor="middle">6. Ablegen</text>
  <text class="sv-tk" x="687" y="92" text-anchor="middle">Git, Kommentare,</text>
  <text class="sv-tk" x="687" y="108" text-anchor="middle">Dokumentation</text>
  <path class="sv-ln-d" d="M439 134 V166 H315 V136" marker-end="url(#skript-ablauf-pf)"/>
  <text class="sv-xc" x="380" y="188" text-anchor="middle">Fehler im Probelauf? Zurück zum Schreiben – nie direkt im Echtbetrieb „ausprobieren“</text>
  <text class="sv-tb" x="380" y="20" text-anchor="middle">Erst denken, dann tippen, dann gefahrlos testen</text>
  <text class="sv-tk" x="380" y="230" text-anchor="middle">Löschen, Verschieben, Deaktivieren: immer erst Probelauf und Liste der betroffenen Objekte</text>
