<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460">
  <defs><marker id="dns-aufloesung-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-box" x="20" y="150" width="150" height="76" rx="6"/>
  <text class="sv-tb" x="95" y="180" text-anchor="middle">Client</text>
  <text class="sv-tk" x="95" y="196" text-anchor="middle">Stub-Resolver</text>
  <text class="sv-tk" x="95" y="212" text-anchor="middle">fragt: www.firma.de?</text>
  <rect class="sv-a" x="270" y="150" width="170" height="76" rx="6"/>
  <text class="sv-tb" x="355" y="180" text-anchor="middle">DNS-Server (rekursiv)</text>
  <text class="sv-tk" x="355" y="196" text-anchor="middle">z. B. DC oder Router</text>
  <text class="sv-tk" x="355" y="212" text-anchor="middle">mit Cache</text>
  <rect class="sv-b" x="560" y="20" width="180" height="60" rx="6"/>
  <text class="sv-tb" x="650" y="45" text-anchor="middle">Root-Server „.“</text>
  <text class="sv-tk" x="650" y="62" text-anchor="middle">kennt alle TLD-Server</text>
  <rect class="sv-c" x="560" y="158" width="180" height="60" rx="6"/>
  <text class="sv-tb" x="650" y="183" text-anchor="middle">TLD-Server „.de“</text>
  <text class="sv-tk" x="650" y="200" text-anchor="middle">kennt NS von firma.de</text>
  <rect class="sv-d" x="560" y="296" width="180" height="60" rx="6"/>
  <text class="sv-tb" x="650" y="321" text-anchor="middle">ns1.firma.de</text>
  <text class="sv-tk" x="650" y="338" text-anchor="middle">autoritativ für firma.de</text>
  <line class="sv-ln" x1="172" y1="176" x2="266" y2="176" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="219" cy="162" r="10"/><text class="sv-tb" x="219" y="166" text-anchor="middle">1</text>
  <line class="sv-ln-a" x1="266" y1="204" x2="172" y2="204" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="219" cy="220" r="10"/><text class="sv-tb" x="219" y="224" text-anchor="middle">8</text>
  <line class="sv-ln" x1="410" y1="148" x2="556" y2="51" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="470" cy="108" r="10"/><text class="sv-tb" x="470" y="112" text-anchor="middle">2</text>
  <line class="sv-ln-a" x1="566" y1="62" x2="430" y2="153" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="520" cy="93" r="10"/><text class="sv-tb" x="520" y="97" text-anchor="middle">3</text>
  <line class="sv-ln" x1="442" y1="180" x2="556" y2="180" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="499" cy="168" r="10"/><text class="sv-tb" x="499" y="172" text-anchor="middle">4</text>
  <line class="sv-ln-a" x1="556" y1="200" x2="442" y2="200" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="499" cy="212" r="10"/><text class="sv-tb" x="499" y="216" text-anchor="middle">5</text>
  <line class="sv-ln" x1="410" y1="228" x2="556" y2="323" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="470" cy="267" r="10"/><text class="sv-tb" x="470" y="271" text-anchor="middle">6</text>
  <line class="sv-ln-a" x1="566" y1="312" x2="430" y2="223" marker-end="url(#dns-aufloesung-pf)"/>
  <circle class="sv-c" cx="520" cy="282" r="10"/><text class="sv-tb" x="520" y="286" text-anchor="middle">7</text>
  <text class="sv-tk" x="20" y="384">1 rekursive Anfrage: „Gib mir die fertige Antwort.“</text>
  <text class="sv-tk" x="20" y="402">2–7 iterative Anfragen: Root → „frag .de“, TLD → „frag ns1.firma.de“,</text>
  <text class="sv-tk" x="20" y="420">      ns1 → „www.firma.de A 203.0.113.10“ (autoritative Antwort)</text>
  <text class="sv-tk" x="400" y="384">8 Antwort an den Client; der DNS-Server speichert sie</text>
  <text class="sv-tk" x="400" y="402">für die Dauer der TTL im Cache – die nächste Anfrage</text>
  <text class="sv-tk" x="400" y="420">nach www.firma.de beantwortet er sofort selbst.</text>
  <text class="sv-tk" x="20" y="448">Vorher schaut der Client in seinen eigenen Cache und in die hosts-Datei; ein Forwarder verkürzt den Weg ab Schritt 2.</text>
</svg>
