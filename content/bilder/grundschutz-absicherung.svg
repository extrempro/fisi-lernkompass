<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220">
  <text class="sv-tb" x="84" y="18" text-anchor="middle">Basis-Absicherung</text>
  <rect class="sv-ln-d" x="14" y="30" width="140" height="120" rx="4"/>
  <rect class="sv-a" x="14" y="30" width="140" height="39.6" rx="4"/>
  <text class="sv-tk" x="84" y="172" text-anchor="middle">ganze Organisation,</text>
  <text class="sv-tk" x="84" y="186" text-anchor="middle">nur Basis-Anforderungen</text>
  <text class="sv-tb" x="240" y="18" text-anchor="middle">Kern-Absicherung</text>
  <rect class="sv-ln-d" x="170" y="30" width="140" height="120" rx="4"/>
  <rect class="sv-a" x="216.2" y="30" width="47.6" height="120" rx="4"/>
  <text class="sv-tk" x="240" y="172" text-anchor="middle">nur „Kronjuwelen“,</text>
  <text class="sv-tk" x="240" y="186" text-anchor="middle">dafür vollständig</text>
  <text class="sv-tb" x="396" y="18" text-anchor="middle">Standard-Absicherung</text>
  <rect class="sv-ln-d" x="326" y="30" width="140" height="120" rx="4"/>
  <rect class="sv-a" x="326" y="30" width="140" height="120" rx="4"/>
  <text class="sv-tk" x="396" y="172" text-anchor="middle">ganze Organisation,</text>
  <text class="sv-tk" x="396" y="186" text-anchor="middle">vollständig (empfohlen)</text>
  <text class="sv-tk" x="240" y="212" text-anchor="middle">Breite = Teil der Organisation · Tiefe = Anteil der Anforderungen</text>
</svg>
