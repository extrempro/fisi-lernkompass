<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420">
  <defs><marker id="tls13-handshake-pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="sv-pf" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="sv-box" x="40" y="12" width="170" height="50" rx="6"/>
  <text class="sv-tb" x="125" y="34" text-anchor="middle">Browser (Client)</text>
  <text class="sv-tk" x="125" y="50" text-anchor="middle">nach TCP-Verbindung auf 443</text>
  <rect class="sv-a" x="550" y="12" width="170" height="50" rx="6"/>
  <text class="sv-tb" x="635" y="34" text-anchor="middle">Webserver</text>
  <text class="sv-tk" x="635" y="50" text-anchor="middle">www.example.de</text>
  <line class="sv-ln-d" x1="125" y1="62" x2="125" y2="320"/>
  <line class="sv-ln-d" x1="635" y1="62" x2="635" y2="320"/>
  <line class="sv-ln" x1="127" y1="100" x2="631" y2="100" marker-end="url(#tls13-handshake-pf)"/>
  <circle class="sv-c" cx="100" cy="100" r="11"/><text class="sv-tb" x="100" y="104" text-anchor="middle">1</text>
  <text class="sv-tb" x="150" y="92">ClientHello</text>
  <text class="sv-tk" x="150" y="118">TLS-Versionen, Cipher Suites, Key Share (ECDHE), Servername (SNI)</text>
  <line class="sv-ln-a" x1="633" y1="160" x2="129" y2="160" marker-end="url(#tls13-handshake-pf)"/>
  <circle class="sv-c" cx="100" cy="160" r="11"/><text class="sv-tb" x="100" y="164" text-anchor="middle">2</text>
  <text class="sv-tb" x="610" y="152" text-anchor="end">ServerHello + Key Share</text>
  <text class="sv-tk" x="610" y="178" text-anchor="end">Ab hier ist alles verschlüsselt:</text>
  <text class="sv-tk" x="610" y="194" text-anchor="end">Zertifikat, CertificateVerify (Beweis: Server hat den privaten Schlüssel), Finished</text>
  <line class="sv-ln" x1="127" y1="236" x2="631" y2="236" marker-end="url(#tls13-handshake-pf)"/>
  <circle class="sv-c" cx="100" cy="236" r="11"/><text class="sv-tb" x="100" y="240" text-anchor="middle">3</text>
  <text class="sv-tb" x="150" y="228">Finished</text>
  <text class="sv-tk" x="150" y="254">Client hat die Zertifikatskette geprüft – Handshake abgeschlossen</text>
  <line class="sv-ln-e" x1="127" y1="292" x2="631" y2="292" marker-start="url(#tls13-handshake-pf)" marker-end="url(#tls13-handshake-pf)"/>
  <circle class="sv-c" cx="100" cy="292" r="11"/><text class="sv-tb" x="100" y="296" text-anchor="middle">4</text>
  <text class="sv-tb" x="150" y="284">HTTP-Daten, symmetrisch verschlüsselt (z. B. AES-GCM)</text>
  <text class="sv-tk" x="40" y="352">Asymmetrisch: Key Share (Diffie-Hellman) für den gemeinsamen Sitzungsschlüssel, Zertifikat für die Identität des Servers.</text>
  <text class="sv-tk" x="40" y="370">Symmetrisch: die eigentlichen Daten – schnell. Zusammen heißt das hybride Verschlüsselung.</text>
  <text class="sv-tk" x="40" y="388">TLS 1.3 braucht nur einen Hin- und Rückweg (1-RTT); TLS 1.2 brauchte zwei.</text>
  <text class="sv-tk" x="40" y="406">Forward Secrecy: Jede Sitzung hat einen neuen Schlüssel – ein später gestohlener Serverschlüssel entschlüsselt alte Mitschnitte nicht.</text>
</svg>
