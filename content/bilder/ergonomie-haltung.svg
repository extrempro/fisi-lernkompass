  <text class="sv-xa" x="304" y="66" text-anchor="middle">Abstand ca. 50–70 cm (eine Armlänge)</text>
  <text class="sv-t" x="470" y="104" text-anchor="start">Oberkante auf oder</text>
  <text class="sv-t" x="470" y="120" text-anchor="start">knapp unter Augenhöhe</text>
  <text class="sv-tk" x="470" y="150" text-anchor="start">Blick leicht nach</text>
  <text class="sv-tk" x="470" y="164" text-anchor="start">unten geneigt</text>
  <text class="sv-t" x="176" y="196" text-anchor="start">Unterarme waagerecht, Ellbogen ≥ 90°</text>
  <text class="sv-t" x="-96" y="200" text-anchor="start">Rücken an der Lehne,</text>
  <text class="sv-tk" x="-96" y="216" text-anchor="start">Lordosenstütze unten</text>
  <line class="sv-ln-d" x1="60" y1="214" x2="88" y2="232"/>
  <text class="sv-t" x="250" y="280" text-anchor="start">Oberschenkel waagerecht,</text>
  <text class="sv-tk" x="250" y="296" text-anchor="start">Kniewinkel 90° oder etwas mehr</text>
  <text class="sv-t" x="272" y="344" text-anchor="start">Füße flach auf dem Boden</text>
  <text class="sv-t" x="512" y="300" text-anchor="start">Tischhöhe</text>
  <text class="sv-tk" x="512" y="316" text-anchor="start">74 cm ± 2 cm oder</text>
  <text class="sv-tk" x="512" y="330" text-anchor="start">höhenverstellbar</text>
  <text class="sv-tk" x="250" y="390" text-anchor="middle">Fenster seitlich: Blickrichtung parallel zur Fensterfront</text>
