  <text class="sv-tk" x="20.0" y="224.0">Nur 1, 6 und 11 überlappen sich nicht. Nachbarkanäle (z. B. 1 und 3) stören sich stärker als zwei Netze auf demselben Kanal.</text>
  <text class="sv-tb" x="20.0" y="262.0">5 GHz in der EU: 19 Kanäle à 20 MHz – viele davon mit DFS (Radarerkennung)</text>
