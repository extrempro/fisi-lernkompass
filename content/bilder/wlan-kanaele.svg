  <text class="sv-tb" x="20.0" y="374.0">6 GHz in der EU (Wi-Fi 6E / 7): 5945–6425 MHz, 24 Kanäle à 20 MHz · 200 mW nur innen, 25 mW (VLP) auch außen</text>
